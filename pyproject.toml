[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "chungbuk-trip-backend"
version = "0.1.0"
description = "Travel-room entry API for the Chungbuk group travel project"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "SQLAlchemy>=2.0,<2.1",
  "PyMySQL[rsa]>=1.1,<2",
  "uvicorn>=0.30,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["mysql: dedicated MySQL 8 integration tests (never the application database)"]
